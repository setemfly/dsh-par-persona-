# LLM provider instances. Keys come from env vars; never commit secrets here.
providers:
  ollama:
    kind: ollama
    model: "qwen3:8b"
    base_url: "http://127.0.0.1:11434/v1"
    timeout_s: 90

  deepseek:
    kind: deepseek
    model: "deepseek-chat"
    api_key_env: "DEEPSEEK_API_KEY"
    timeout_s: 60

  openai:
    kind: openai
    model: "gpt-4.1-mini"
    api_key_env: "OPENAI_API_KEY"
    timeout_s: 60

  anthropic:
    kind: anthropic
    model: "claude-sonnet-4-20250514"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_s: 60

  fake:
    kind: fake
    model: "fake-1"
