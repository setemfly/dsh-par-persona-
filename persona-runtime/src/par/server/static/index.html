<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>par · 林汐</title>
<style>
  :root { --bg:#0e1116; --panel:#151a22; --line:#232a35; --text:#e6e9ef; --muted:#8b95a5; --accent:#7aa2f7; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:820px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .dot { width:8px; height:8px; border-radius:50%; background:#3fb950; }
  header .meta { margin-left:auto; color:var(--muted); font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-break:break-word; }
  .me { align-self:flex-end; background:#1f6feb; color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bot .tools { margin-top:8px; display:flex; gap:10px; color:var(--muted); font-size:12px; }
  .bot .tools button { background:none; border:none; color:var(--accent); cursor:pointer; padding:0; font-size:12px; }
  .sys { align-self:center; color:var(--muted); font-size:12px; }
  form { display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line); background:var(--bg); }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:11px 14px; font:inherit; max-height:140px; }
  button.send { background:var(--accent); color:#0b1020; border:none; border-radius:12px; padding:0 18px; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
  details { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot"></span>
    <h1>林汐 <span style="color:var(--muted);font-weight:400">· persona runtime</span></h1>
    <span class="meta" id="meta">连接中…</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="说点什么… (Enter 发送 / Shift+Enter 换行)"></textarea>
    <button class="send" id="send" type="submit">发送</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const meta = document.getElementById('meta');

async function health() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    meta.textContent = `${j.provider} · affect v${j.affect_version} · ${j.turns} turns`;
  } catch { meta.textContent = '离线'; }
}

function bubble(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'me' ? 'me' : 'bot');
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  bubble('me', text);
  send.disabled = true;
  const thinking = bubble('bot', '…');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || j.error || 'error');
    thinking.textContent = j.reply;
    const tools = document.createElement('div');
    tools.className = 'tools';
    const s = j.labels || {};
    tools.innerHTML = `<span>resolve ${(s.resolve||0).toFixed(2)} · distress ${(s.distress||0).toFixed(2)} · closeness ${(s.closeness||0).toFixed(2)}</span>`;
    const play = document.createElement('button');
    play.textContent = '🔊 朗读';
    play.onclick = () => speak(j.reply);
    tools.appendChild(play);
    thinking.appendChild(tools);
  } catch (err) {
    thinking.textContent = '出错了：' + err.message;
  } finally {
    send.disabled = false;
    input.focus();
    health();
  }
});

async function speak(text) {
  try {
    const r = await fetch('/v1/audio/speech', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: text })
    });
    if (!r.ok) { alert('本机语音不可用（见 docs/voice.md）'); return; }
    const blob = await r.blob();
    new Audio(URL.createObjectURL(blob)).play();
  } catch { alert('本机语音不可用'); }
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
health();
input.focus();
</script>
</body>
</html>
