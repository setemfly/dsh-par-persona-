# dsh-par-persona：把 persona-runtime（默认人格「林汐」）接进 DSH。
#
# 安装：桌面版 → 设置 → 插件 → 安装本地插件，选择本目录；
# 或 `dsh plugin --profile web add <本目录>`，随后重启 DSH。
#
# 下面的 config 指向本机 persona-runtime。换目录/换机器时改这里，
# 或删掉 config、改用环境变量 PAR_RUNTIME_DIR 与 PAR_PYTHON。
- insert:
    - id: par-persona
      name: dsh-par-persona
      config:
        runtimeDir: 'D:/变人/persona-runtime'
        python: 'D:/变人/.venv/Scripts/python.exe'
        configPath: 'D:/变人/persona-runtime/configs/runtime.yaml'
        # provider: deepseek        # 覆盖 configs/runtime.yaml 的 provider
        # model: deepseek-chat
        # port: 7879
